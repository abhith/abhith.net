name: PR title

on:
  # pull_request_target so it also works for fork PRs; this workflow never checks out PR code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the commit style used in this repo, e.g. "feat: ...", "content(topics): ...".
          types: |
            feat
            fix
            content
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
