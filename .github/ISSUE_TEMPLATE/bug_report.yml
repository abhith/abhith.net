name: Bug report
description: Something on the site is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with [abhith.net](https://www.abhith.net).
        For typos or mistakes inside a post or snippet, please use the **Content correction** template instead.

  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where did you see the problem?
      placeholder: https://www.abhith.net/blog/...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Press ⌘K and type '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layout / styling
        - Theme switcher (paper / midnight / solar)
        - Command palette / search
        - Knowledge graph
        - Code blocks / diagrams / embeds
        - RSS / sitemap / SEO / social cards
        - Accessibility
        - Performance
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 140 on macOS 26, Safari on iOS 26
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or other context
      description: Drag and drop screenshots here. Paste console output as text if possible.
    validations:
      required: false
